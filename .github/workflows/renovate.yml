# Self-hosted Renovate: opens dependency update PRs based on renovate.json.
# Runs Monday evening (17:00 UTC = 18:00 CET / 19:00 CEST) and on demand.
#
# Requires the repository secret RENOVATE_TOKEN: a fine-grained personal access token for this repository
# with read/write access to Contents, Pull requests, Issues (dependency dashboard) and Workflows
# (to update action versions in .github/workflows). The default GITHUB_TOKEN is not used on purpose:
# PRs opened with it do not trigger the build workflow, so updates would never get tested.

name: Renovate

on:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
    - name: Run Renovate
      uses: renovatebot/github-action@v46.3.9
      with:
        token: ${{ secrets.RENOVATE_TOKEN }}
      env:
        RENOVATE_REPOSITORIES: ${{ github.repository }}
        # the repository already has its renovate.json, no onboarding PR needed
        RENOVATE_ONBOARDING: 'false'
        LOG_LEVEL: info
